[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "uv-dynamic-versioning" ]

[project]
name = "otpa"
description = "Convert between otpauth:// and otpauth-migration:// (Google Authenticator) links"
readme = "README.md"
keywords = [
  "cli",
  "google-authenticator",
  "migration",
  "otp",
  "otpauth",
  "qrcode",
  "totp",
  "two-factor-authentication",
]
license = { text = "MIT" }
authors = [ { name = "eggplants" } ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Systems Administration :: Authentication/Directory",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "pypng>=0.20.1",
  "qrcode>=7.4.2",
]
urls.Documentation = "https://egpl.dev/otpa/"
urls.Issues = "https://github.com/eggplants/otpa/issues"
urls.Repository = "https://github.com/eggplants/otpa"
scripts.otpa = "otpa.cli:main"

[dependency-groups]
dev = [
  "pymarkdownlnt>=0.9.33",
  "pyproject-fmt>=2.11.1",
  "pytest>=9.0.2",
  "pytest-cov>=7",
]
docs = [
  "pdoc>=16",
]

[tool.hatch]
version.source = "uv-dynamic-versioning"
build.targets.wheel.packages = [ "otpa" ]
build.targets.sdist.packages = [ "otpa" ]

[tool.uv]
python-downloads = "never"
default-groups = [
  "dev",
  "docs",
]
exclude-newer = "P7D"
preview = true

[tool.ruff]
line-length = 120
format.indent-style = "space"
format.quote-style = "double"
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812",
  "CPY001", # Missing copyright notice (this project does not use file headers)
  "D",
]
lint.per-file-ignores."otpa/cli.py" = [
  "T201", # `print` found
]
lint.per-file-ignores."otpa/migration.py" = [
  "SLF001", # Private member accessed (enum _value2member_map_)
]
lint.per-file-ignores."tests/**" = [
  "ANN",     # Missing type annotations (tests/fixtures)
  "ARG",     # Unused arguments (pytest fixtures, lambda stubs)
  "CPY001",  # Missing copyright notice
  "INP001",  # Implicit namespace package (no __init__ in tests)
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S105",    # Possible hardcoded password (test fixtures)
  "S106",    # Possible hardcoded password argument (test fixtures)
  "T201",    # `print` found
]
lint.pydocstyle.convention = "google"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"
